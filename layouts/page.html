{{ define "main" }}
{{ with .Params.watermark }}<div class="watermark" aria-hidden="true">{{ . }}</div>{{ end }}
<article>
  <h1{{ if ne .Section "posts" }} class="sr-only"{{ end }}>{{ .Title }}</h1>
  {{ if and .Date (eq .Section "posts") }}{{ partial "post-meta.html" . }}{{ end }}
  {{ .Content }}
</article>
{{ if eq .Section "posts" }}{{ partial "related.html" . }}{{ end }}
{{ end }}
