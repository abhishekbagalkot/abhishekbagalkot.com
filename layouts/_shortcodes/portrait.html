{{ $src := "img/abhishek.jpg" }}
{{ if (resources.Get $src) }}
<img class="portrait" src="{{ $src | relURL }}" alt="Abhishek Bagalkot" width="200" height="200">
{{ else if (fileExists (printf "/static/%s" $src)) }}
<img class="portrait" src="{{ $src | relURL }}" alt="Abhishek Bagalkot" width="200" height="200">
{{ end }}
