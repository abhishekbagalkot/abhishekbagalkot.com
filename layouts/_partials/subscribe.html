<aside class="subscribe">
  <h2>Get new posts previews on email</h2>
  <form action="https://buttondown.com/api/emails/embed-subscribe/abhishekbagalkot"
        method="post"
        class="subscribe-form">
    <label class="sr-only" for="bd-email">Email address</label>
    <input type="email" name="email" id="bd-email" placeholder="you@example.com" autocomplete="email" required>
    <button type="submit">Subscribe</button>
  </form>
</aside>
