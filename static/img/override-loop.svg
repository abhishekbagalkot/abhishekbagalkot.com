<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img"
     aria-label="A loop: the optimiser produces a plan, the dispatcher overrides it, the override reveals a constraint nobody wrote down, which feeds back into the plan.">
  <style>
    :root { color-scheme: light dark; }
    .box  { fill: none; stroke: #d8d1c3; stroke-width: 1.5; }
    .txt  { fill: #1c1b19; font: 15px Charter, Georgia, serif; }
    .lead { fill: #1c1b19; font: 600 15px Charter, Georgia, serif; }
    .arr  { stroke: #8a4b2a; stroke-width: 1.5; fill: none; }
    .head { fill: #8a4b2a; }
    .note { fill: #6b675f; font: italic 13.5px Charter, Georgia, serif; }
    @media (prefers-color-scheme: dark) {
      .box  { stroke: #3d3a35; }
      .txt, .lead { fill: #eceae5; }
      .arr  { stroke: #d99b6c; }
      .head { fill: #d99b6c; }
      .note { fill: #9b968c; }
    }
  </style>

  <g>
    <rect class="box" x="6"   y="24" width="196" height="76" rx="4"/>
    <text class="lead" x="104" y="56" text-anchor="middle">The plan</text>
    <text class="txt"  x="104" y="78" text-anchor="middle">optimiser output</text>

    <rect class="box" x="262" y="24" width="196" height="76" rx="4"/>
    <text class="lead" x="360" y="56" text-anchor="middle">The override</text>
    <text class="txt"  x="360" y="78" text-anchor="middle">dispatcher intervenes</text>

    <rect class="box" x="518" y="24" width="196" height="76" rx="4"/>
    <text class="lead" x="616" y="56" text-anchor="middle">The constraint</text>
    <text class="txt"  x="616" y="78" text-anchor="middle">nobody wrote down</text>
  </g>

  <g>
    <path class="arr" d="M206 62 H252"/>
    <polygon class="head" points="252,62 244,57.5 244,66.5"/>
    <path class="arr" d="M462 62 H508"/>
    <polygon class="head" points="508,62 500,57.5 500,66.5"/>

    <path class="arr" d="M616 104 V176 H104 V110"/>
    <polygon class="head" points="104,104 99.5,112 108.5,112"/>
  </g>

  <text class="note" x="360" y="204" text-anchor="middle">Each override is a labelled example of something the model was never told — free specification</text>
</svg>
